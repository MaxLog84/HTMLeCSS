<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        table {
            width: 500px;
            border-collapse: collapse;

        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        .vermelho {
            background-color: bisque;
        }

        col.cnome {
            background-color: aqua;
        }

        div#conteiner {
            overflow-x: auto;
            background-size: ;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>
    
    <div id="conteiner">
        <table>
            <colgroup>
                <col class="cnome">
                <col class="vermelho" span="3">
        
                <col class="cprof">
            </colgroup>
            <caption>Cadatro</caption>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
            <tr>
                <td>Cláudio</td>
                <td>M</td>
                <td>28</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Gustavo</td>
                <td>M</td>
                <td>42</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>Maxwell</td>
                <td>M</td>
                <td>42</td>
                <td>Militar</td>
            </tr>
            <tr>
                <td>Ana Lidia</td>
                <td>F</td>
                <td>32</td>
                <td>Advogada</td>
            </tr>
            <tr>
                <td>Arthur</td>
                <td>M</td>
                <td>22</td>
                <td>Astrologo</td>
            </tr>
        </table>
    </div>
</body>
</html>
