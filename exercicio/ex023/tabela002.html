<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }
        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: rgb(221, 219, 219);
            border: 1px solid black;
            border-bottom: none;
           
            
        }
        td, th{
            border: 1px solid black; 
            padding: 10px;
        }
        thead, tfoot{
            background-color: gray;
            color: white;
        }
        thead > tr >th {
            position: sticky;
            top: 0;
            background-color: gray;
        }
        tbody > tr:nth-child(even){
            background-color: beige;
        }
        
        td.num {
            text-align: right;
        }
    </style>
</head>

<body>
    <h1>Tabelas Grandes</h1>
    <!-- 
    ANATOMIA PARA TABELA GRANDES 
    TABLE
        THEAD
            TR, TD, TH
        TBODY
            TR, TD, TH
        TFOOT
            TR, TD, TH-->

    <table>
        <caption>
            População dos Estados
        </caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 50px;">População</th>

            </tr>
            
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45 919 049</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 168 791</td>

            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17 264 943</td>
            </tr>
        </tbody>
        <tfoot>
            <th>Total de Habitantes</th>
            <td scope="row" class="num"><strong>0000</strong></td>
        </tfoot>

    </table>
</body>
</html>
