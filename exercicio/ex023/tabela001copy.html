<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            border-collapse: collapse;
        }
        tr.linha1{
            background-color: gray;
        }
        tr.linha2{
            background-color: beige;
        }
        td { 
            border: 1px solid black;
            padding: 8px;
        }
        td.dado{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Primeira Tabela</h1>
    <!-- HIERARQUIA DE TABLEAS
                TABLE = tabela
                    TABLE ROW = Linha de tabela
                        TABLE HEADER = cabeçalho de tabela
                            TABLE DATA = dados de tabela  -->
    <table>
        <tr class="linha1"><!-- Primeira Liha -->
            <td>A1</td>
            <td>B2</td>
            <td>C3</td>
        </tr> 

        <tr class="linha2"><!-- Segunda linha -->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>

        </tr>

        <tr class="linha1">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>

        </tr> 

        <tr class="linha2">
            <td>A4 <!-- Aualmente não há a necessidade de fechar a tag -->
            <td>B4
            <td>C4
        </tr>

        <tr>
            <td>A5</td>
            <td>B5</td>
        </tr>
        
        <tr>
            <td class="dado">A6</td>
        </tr>

    </table>
</body>
</html>
