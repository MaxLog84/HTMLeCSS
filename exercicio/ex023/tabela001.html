<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }
       
        td { 
            border: 1px solid black;
            padding: 8px;
            text-align: center; /* Alinhamento horizontal */
            vertical-align: middle; /* Alinhamento vertical: top, bottom, middle */ 
        }
        .numero{
            text-align: justify;
        }
       
    </style>
</head>
<body>
    <h1>Primeira Tabela</h1>
    <!-- HIERARQUIA DE TABLEAS
                TABLE = tabela
                    TABLE ROW = Linha de tabela
                        TABLE HEADER = cabeçalho de tabela
                            TABLE DATA = dados de tabela  -->
    <table>
        <tr><!-- Primeira Liha -->
            <td>A1</td>
            <td>B2</td>
            <td>C3</td>
        </tr> 

        <tr><!-- Segunda linha -->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>

        </tr>

        <tr>
            <td>A3</td>
            <td class="numero">B3</td>
            <td>C3</td>

        </tr> 

        <tr>
            <td>A4 <!-- Aualmente não há a necessidade de fechar a tag -->
            <td>B4
            <td>C4
        </tr>


    </table>
</body>
</html>
