<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>imagens dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplemente aumennte e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/pequena.png" type="image/png"> <!--Se a janela diminuir menos de 750px ela abre a imagem pequena-->
        <source media="(max-width: 1050px)" srcset="imagens/media.png" type="image/png"> <!--Se a janela diminuir menos de 1050px ela abre a imagem média-->
        <img src="imagens/grande.png" alt="imagem flexivel">
    </picture>
</body>
</html>
