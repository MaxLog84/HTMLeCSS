<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever um 
        paragrafo de qualquer
        jeito. Basta colocar
        tudo entre &lt;p&gt;  &lt;/p&gt; <!-- LESS THAN (MENOR QUE)/ GREATER THAN (MAIOR QUE)-->
        <p>Se precisar quebrar 
            o texto em algum
            lugar especifico, utilizar
            a tag <br> &lt;br&gt; para funcionar

            &COPY;
            &REG;
            &trade;
            &delta;
            &sum;
        </p>
        <p>vamos adicionar alguns emojis: 
            &#x1F596;
            &#x1f913;
        </p>
    </p>
</body> 
</html>
