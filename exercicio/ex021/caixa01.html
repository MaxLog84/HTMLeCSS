<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{ /* box-level */
            background-color: lightgreen;
            height: 300px;
            width: 300px;

            border-width: 10px;
            border-style: solid;
            border-color: darkblue;

            /* border: 10px solid darkblue;  shorthands ou simplificar propiedades em uma única linha*/

            /* padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px; */

            padding: 10px 10px 10px 10px; /* shorthands */
            /* padding: 10px; se todos forem iguais
            padding: 10px 20px;  se o topo e baixo iguais e se direita e esqurda iguais */

            /* margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px; */

            margin: 10px; /* shorthands margin */

            /* outline-width: 5px;
            outline-style: dashed;
            outline-color: violet;  */

            outline: 5px dashed rgb(146, 130, 238) ;
        }
        a{ /* inlene-level */
            border-color: red;
            border-width: 3px;
            border-style: solid;
        }
    </style>
</head>
<body>
    <h1>Exemplos de caixa box-level</h1>
    <p>Parágrafos também são exempolos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>

    
</body>
</html>
